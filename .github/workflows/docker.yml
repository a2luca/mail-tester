name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  build:
    name: Build & push (Dockerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/mailtest
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nix-image:
    name: Build & push (Nix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nix image
        run: nix build .#dockerImage --out-link result-nix-image

      - name: Push Nix image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mailtest-nix"
          TAG="${GITHUB_REF_NAME:-main}"
          nix run nixpkgs#skopeo -- --insecure-policy copy \
            docker-archive:result-nix-image \
            "docker://${IMAGE}:${TAG}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            nix run nixpkgs#skopeo -- --insecure-policy copy \
              docker-archive:result-nix-image \
              "docker://${IMAGE}:latest"
          fi
